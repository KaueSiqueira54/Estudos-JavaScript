<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário4</title>
  </head>
  <body>
    <form action="" method="get" autocomplete="on">
      <fieldset>
        <legend>sexo</legend>
        <input type="radio" name="sexo" id="sxmas" checked value="M" />
        <label for="sxmas">Masculino</label>
        <br />

        <input type="radio" name="sexo" id="sxfem" value="F" />
        <label for="sxfem">Feminino</label>
      </fieldset>
      <fieldset>
        <legend>Esportes favoritos</legend>
        <input type="checkbox" name="futebol" id="futebol" checked />
        <label for="futebol">Futebol</label> <br />
        <input type="checkbox" name="basquete" id="basquete" />
        <label for="basquete">Basquete</label> <br />
        <input type="checkbox" name="esporte" id="esporte" /> Basebol <br />
        <input type="checkbox" name="esporte" id="esporte" /> Natação <br />
      </fieldset>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
