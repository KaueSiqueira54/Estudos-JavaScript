<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tabela 1</h1>

    <!-- <Table/> delimita a tabela -->
    <!-- Hierarquia de tabelas simples -->
    <!-- 
        TABLE = tabela
            TABLE ROW = linha de tabela
                TABLE HEADER = cabeçalho de tabela
                TABLE DATA = dado da tabela
     -->

    <!-- Tabela -->
    <table>
      <!-- Primeira linha -->
      <tr>
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>

      <!-- Segunda linha -->
      <tr class="linha">
        <td>A2</td>
        <td>B2</td>
        <td>C3</td>
      </tr>

      <!-- Terceira linha -->
      <tr>
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
      </tr>

      <!-- Terceira linha -->
      <tr class="linha">
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
      </tr>
    </table>
    <br />
    <br />

    <!-- Tabela 2 -->
    <table>
      <!-- Cabeçalho -->
      <caption>
        Titulo da Tabela
      </caption>

      <thead>
        <tr>
          <th>Produto</th>
          <th>Preço</th>
          <th>Quantidade</th>
        </tr>
      </thead>

      <!-- Corpo da tabela -->
      <tbody>
        <!-- Primeira linha -->
        <tr>
          <td>Teclado mecânico</td>
          <td>R$: 199,99</td>
          <td>10</td>
        </tr>

        <!-- Segunda linha -->
        <tr>
          <td>Mouse Sem Fio</td>
          <td>R$ 150,00</td>
          <td>1</td>
        </tr>

        <!-- Terceira linha -->
        <tr>
          <!-- Ocupa duas linhas verticalmente -->
          <td rowspan="2">Monitor 24</td>
          <td>R$ 800,00</td>
          <td>1</td>
        </tr>

        <!-- quarta linha -->
        <tr>
          <td>(Modelo IPS)</td>
          <td>-</td>
        </tr>
      </tbody>

      <!-- Rodapé -->
      <tfoot>
        <tr>
          <!-- Ocupa duas colunas horizontalmente -->
          <th colspan="2" rowspan="2">Total de Itens</th>
          <td>4</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
