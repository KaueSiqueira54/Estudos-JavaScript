<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas grandes</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Anatomia de tabelas grandes -->
    <!-- TABLE
            THEAD
              TR, TD, TH
            TBODY
              TR, TD, TH
            TFOOT
              TR, TD, TH 
     -->

    <table>
      <thead>
        <tr>
          <th>Estado</th>
          <th>População</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>São Paulo</td>
          <td>45.987.32</td>
        </tr>
        <tr>
          <td>Minas Gerais</td>
          <td>45.987.32</td>
        </tr>
        <tr>
          <td>Rio de Janeiro</td>
          <td>45.987.32</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th>Total de habitantes</th>
          <td>0000</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
