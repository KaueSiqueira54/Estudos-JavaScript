<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="form">
      <label for="f_nome">Nome:</label>
      <input
        type="text"
        name="nome"
        id="f_nome"
        minlength="4"
        maxlength="8"
        required
      />
      <label for="f_nota">Nota:</label>
      <input type="number" name="nota" id="f_nota" min="0" max="10" required />

      <input id="btn_validar" type="submit" value="Validar" />

      <p id="f_msg"></p>
    </form>

    <script defer src="index.js"></script>
  </body>
</html>
